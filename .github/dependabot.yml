version: 2

# `directory` is relative to the repository root and must start with `/`.
# For github-actions that is `/` — Dependabot finds `.github/workflows/`
# itself, and pointing it at `/.github/workflows` silently matches nothing.
#
# Minor and patch bumps are grouped into one PR per ecosystem so a solo
# maintainer gets one thing to review a week instead of twenty. Majors are
# deliberately left ungrouped: those are the ones that break a build or change
# behaviour, and each deserves its own PR and its own CI run.
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
