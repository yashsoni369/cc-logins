name: Smoke build

# An unsigned Windows installer for a manual smoke test before a release.
# Builds on every push to a release branch, or by hand from the Actions tab;
# release.yml builds the signed ones.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: smoke-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No updater artifacts: they need the release signing key.
      - name: Build the installer
        shell: bash
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v7
        with:
          name: cc-logins-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
