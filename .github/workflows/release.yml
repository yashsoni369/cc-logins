name: Release

# Tag-triggered. Push a tag like `v0.1.0` to build installers for every
# platform and stage them on a draft GitHub release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # A tag says nothing about what the files claim. Tauri stamps the version
  # from tauri.conf.json into every installer, so pushing v0.2.0 while the
  # files still say 0.1.0 produces a v0.2.0 release full of 0.1.0 artifacts.
  verify-version:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag against all three version fields
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"

          fail=0
          for pair in "package.json:$PKG" "tauri.conf.json:$CONF" "Cargo.toml:$CARGO"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$TAG" ]; then
              echo "::error::$name is $value but the tag is $TAG"
              fail=1
            fi
          done
          exit $fail

  release:
    name: Build (${{ matrix.platform }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-14   # Apple Silicon (arm64)
          - platform: macos-13   # Intel (x86_64)
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Same package list as ci.yml's Linux job — see that file's comment
      # for why cargo/tauri need these even before bundling.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-action drives `pnpm tauri build` itself (using
      # beforeBuildCommand from tauri.conf.json) and, on a tag push,
      # uploads the resulting per-platform installers (nsis on Windows, dmg
      # on macOS, deb/appimage on Linux) to a GitHub release matching the
      # tag, creating it as a draft so a human reviews and publishes it.
      - name: Build and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Code signing: NOT configured yet. ---
          # This project currently ships unsigned builds — see the
          # "Signing" section of the README, which is the honest state of
          # things as of this workflow being written. None of the secret
          # names below exist in this repository yet. They are placeholders
          # showing what tauri-action expects; wire up the real secrets
          # (Settings -> Secrets and variables -> Actions) and uncomment
          # only once actual certificates/credentials are obtained. Do not
          # invent values for these — an unset secret silently resolves to
          # an empty string, which is a no-op for tauri-action, not a
          # failure, so leaving them commented is equivalent to leaving them
          # unset.
          #
          # Windows Authenticode signing (e.g. once approved for the
          # SignPath Foundation's free OSS signing, see PLAN.md §7):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          #
          # macOS signing + notarization (requires a paid Apple Developer
          # Program membership):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Tauri updater artifact signing — only meaningful once
          # tauri-plugin-updater is actually added as a dependency (it is
          # not, as of this workflow: see src-tauri/Cargo.toml):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC Logins ${{ github.ref_name }}'
          releaseBody: |
            Installers for Windows, macOS (Apple Silicon and Intel), and Linux are attached below.

            These builds are unsigned. Windows SmartScreen and macOS Gatekeeper will warn before
            running them — see the README's "Signing" section for what that means and why.
          releaseDraft: true
          prerelease: false

          # Tauri's default asset names embed the version, which breaks
          # `releases/latest/download/<file>` permalinks on every release.
          # Dropping [version] makes those links stable; [arch] still separates
          # the two macOS builds.
          releaseAssetNamePattern: CC-Logins-[platform]-[arch][setup][ext]
