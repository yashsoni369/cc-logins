[package]
name = "cc-logins"
version = "0.1.0"
# Kept byte-identical to package.json's `description` and tauri.conf.json's
# `bundle.shortDescription`. Tauri falls back to these Cargo fields when the
# bundle config omits them, and they surface in the deb/RPM metadata, so drift
# between the three shows up in shipped installers.
description = "Quota visibility and account switching for Claude Code"
# Tauri prefers Cargo `authors` over `bundle.publisher` for the deb Maintainer.
authors = ["Yash Soni"]
repository = "https://github.com/yashsoni369/cc-logins"
homepage = "https://github.com/yashsoni369/cc-logins"
# This is an application, never a published crate.
publish = false
edition = "2021"
# 1.81, not Tauri's own 1.77 floor: `resilience.rs`'s panic hook takes a
# `std::panic::PanicHookInfo`, which was only stabilised (renamed from
# `PanicInfo`) in 1.81. Declaring 1.77 was inaccurate — `cargo clippy` caught
# it via `clippy::incompatible_msrv`.
rust-version = "1.81"
license = "MIT"

# Portions of the credential, path and usage logic are ported from
# claude-swap (MIT) — https://github.com/realiti4/claude-swap

[lib]
name = "cc_logins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Two instances would mean two auto-switch daemons racing for the same
# credential lock. Exactly one process may own the tray.
tauri-plugin-single-instance = "2"
# Updates are fetched by the app and verified against the public key in
# tauri.conf.json before anything is executed. That signature is independent of
# Authenticode: the installers are unsigned and warned about on first run, but
# every update after that is cryptographically checked, and never carries the
# mark of the web that triggers SmartScreen in the first place.
tauri-plugin-updater = "2"
# `relaunch` after an update. On Windows the installer restarts the app itself,
# but macOS and Linux need this.
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
# Used by login.rs (interactive_login) to create the isolated CLAUDE_CONFIG_DIR
# temp directory at runtime — previously only a [dev-dependencies] entry,
# which covered the test suite but not a real (non-test) build.
tempfile = "3"

# Tray icon bitmaps are rasterised at runtime: Windows tray icons carry no
# text label, so the utilisation number is drawn into the image itself.
tiny-skia = "0.12"

# Local usage history. Bundled so no system SQLite is required.
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Unwind, deliberately, despite the smaller binary `abort` would give.
#
# `poller.rs` builds its "one bad tick must not kill the daemon" guarantee on
# `std::panic::catch_unwind` around the decision logic, tray rendering and
# history recording. Under `panic = "abort"` the process terminates before any
# of those guards can run, so that entire architecture was dead code in every
# release build. `abort` also skips all destructors, which is how a temp
# directory holding a real credential could survive a crash.
#
# Unwinding makes lock poisoning real, so every `Mutex` used across a possible
# panic recovers from `PoisonError` rather than unwrapping.
panic = "unwind"
strip = true
